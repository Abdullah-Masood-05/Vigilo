name: CI / CD (GPU)

on:
  push:
    branches: [gpu-directml]
  pull_request:
    branches: [gpu-directml]
  workflow_dispatch:

env:
  # Minimal static ffmpeg, one binary per OS, built in
  # Abdullah-Masood-05/ffmpeg-minimal-build and fetched at build time.
  FFMPEG_RELEASE: v7.1.4-multiplatform

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      # Five fetches from three third-party release pages on every run was
      # both slow and a failure source unrelated to this code.
      - name: Cache model weights
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-v1-yunet2023mar-headpose_mbv3s-mobileone_s0-yolox_nano-w600k_mbf

      - name: Download model weights
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models ffmpeg
          touch ffmpeg/.keep
          curl -sSL -o models/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSL -o models/headpose_mobilenetv3_small.onnx https://github.com/yakhyo/head-pose-estimation/releases/download/weights/mobilenetv3_small.onnx
          curl -sSL -o models/mobileone_s0_gaze.onnx https://github.com/yakhyo/gaze-estimation/releases/download/weights/mobileone_s0_gaze.onnx
          curl -sSL -o models/yolox_nano.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          curl -sSL -o buffalo_sc.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip
          unzip -j buffalo_sc.zip w600k_mbf.onnx -d models
          rm -f buffalo_sc.zip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97
          components: clippy, rustfmt

      # Without this every job rebuilt Tauri, ONNX Runtime and the whole tree
      # from scratch. The ORT download cache is included because ort-sys's
      # cached build output points into it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-directories: ${{ runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io' || runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io' || '~/.cache/ort.pyke.io' }}

      - name: Run clippy and tests
        run: |
          cd src-tauri
          cargo clippy --all-targets --features gpu-cuda
          cargo test --features gpu-cuda

  build:
    name: Build Installers
    needs: test
    runs-on: ${{ matrix.platform }}
    env:
      # The preprocessing loops want AVX2. x86-64-v3 = Haswell (2013) / Zen 1
      # or newer; see README "Requirements". Not `native`: this ships from CI.
      RUSTFLAGS: ${{ matrix.platform != 'macos-latest' && '-C target-cpu=x86-64-v3' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # One GPU execution provider per OS (see `[features]` in Cargo.toml).
        # Linux also merges tauri.gpu-cuda.conf.json, which puts ORT's CUDA
        # provider libraries beside the binary in the .deb and .rpm.
        include:
          - platform: windows-latest
            tauri-args: --features gpu-directml
          - platform: macos-latest
            tauri-args: --features gpu-coreml
          - platform: ubuntu-latest
            tauri-args: --features gpu-cuda --config src-tauri/tauri.gpu-cuda.conf.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev rpm libarchive-tools

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97

      # Without this every job rebuilt Tauri, ONNX Runtime and the whole tree
      # from scratch. The ORT download cache is included because ort-sys's
      # cached build output points into it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-directories: ${{ runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io' || runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io' || '~/.cache/ort.pyke.io' }}

      # Five fetches from three third-party release pages on every run was
      # both slow and a failure source unrelated to this code.
      - name: Cache model weights
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-v1-yunet2023mar-headpose_mbv3s-mobileone_s0-yolox_nano-w600k_mbf

      - name: Download model weights
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models ffmpeg
          touch ffmpeg/.keep
          curl -sSL -o models/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSL -o models/headpose_mobilenetv3_small.onnx https://github.com/yakhyo/head-pose-estimation/releases/download/weights/mobilenetv3_small.onnx
          curl -sSL -o models/mobileone_s0_gaze.onnx https://github.com/yakhyo/gaze-estimation/releases/download/weights/mobileone_s0_gaze.onnx
          curl -sSL -o models/yolox_nano.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          curl -sSL -o buffalo_sc.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip
          unzip -j buffalo_sc.zip w600k_mbf.onnx -d models
          rm -f buffalo_sc.zip

      - name: Download ffmpeg
        shell: bash
        run: |
          base="https://github.com/Abdullah-Masood-05/ffmpeg-minimal-build/releases/download/${FFMPEG_RELEASE}"
          mkdir -p ffmpeg
          case "$RUNNER_OS" in
            Windows) curl -fsSL -o ffmpeg/ffmpeg.exe "$base/ffmpeg-windows-x86_64.exe" ;;
            macOS)   curl -fsSL -o ffmpeg/ffmpeg "$base/ffmpeg-macos-arm64" && chmod +x ffmpeg/ffmpeg ;;
            Linux)   curl -fsSL -o ffmpeg/ffmpeg "$base/ffmpeg-linux-x86_64" && chmod +x ffmpeg/ffmpeg ;;
          esac
          ls -la ffmpeg

      - name: Install dependencies
        run: bun install

      - name: Build Tauri
        run: bun run tauri build ${{ matrix.tauri-args }}

      # copy-dylibs leaves symlinks into the host's ORT cache, which the Arch
      # container below cannot see. Resolve them into the workspace first.
      - name: Collect CUDA provider libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ort-providers
          cp -L src-tauri/target/release/libonnxruntime_providers_shared.so \
                src-tauri/target/release/libonnxruntime_providers_cuda.so ort-providers/
          ls -la ort-providers/

      - name: Build Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:base-devel \
            bash -c "
              useradd -m builduser
              echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              mkdir -p /tmp/archpkg/src
              cp /workspace/src-tauri/target/release/vigilo /tmp/archpkg/src/vigilo
              cp -r /workspace/models /tmp/archpkg/src/
              cp -r /workspace/ffmpeg /tmp/archpkg/src/ 2>/dev/null || true
              cp /workspace/ort-providers/*.so /tmp/archpkg/src/
              cp /workspace/src-tauri/icons/icon.png /tmp/archpkg/src/icon.png
              cat << 'EOF' > /tmp/archpkg/src/vigilo.desktop
          [Desktop Entry]
          Name=Vigilo
          Comment=Webcam proctoring for online exams
          Exec=vigilo
          Icon=vigilo
          Terminal=false
          Type=Application
          Categories=Utility;Education;
          EOF
              cp /workspace/pkg/arch/PKGBUILD /tmp/archpkg/
              chown -R builduser:builduser /tmp/archpkg
              cd /tmp/archpkg
              su builduser -c 'makepkg -f --nodeps --skipchecksums'
              mkdir -p /workspace/src-tauri/target/release/bundle/arch
              cp /tmp/archpkg/*.pkg.tar.zst /workspace/src-tauri/target/release/bundle/arch/
            "

      - name: Prepare installer artifacts
        shell: bash
        run: |
          mkdir -p dist-installers
          if [ "$RUNNER_OS" = "Windows" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-installers/ \;
          elif [ "$RUNNER_OS" = "macOS" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} dist-installers/ \;
          else
            find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.pkg.tar.zst" \) -exec cp {} dist-installers/ \;
          fi
          ls -la dist-installers/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist-installers/*
          if-no-files-found: error

  release:
    name: Update GPU Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/gpu-directml'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-installers
          pattern: installers-*
          merge-multiple: true

      - name: Publish GPU Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-gpu
          name: "Vigilo v1.0.0 (GPU build)"
          prerelease: true
          files: |
            downloaded-installers/*
          generate_release_notes: false
          body: |
            GPU-accelerated pre-release build of Vigilo v1.0.0. Every model runs on the platform's GPU execution provider for ONNX Runtime, falling back to CPU per model if that provider cannot start.

            ### GPU per platform
            - **Windows — DirectML**: any DirectX 12 GPU, integrated or discrete. Measured on Intel integrated graphics: face/pose/gaze pipeline ~27 ms → ~5.8 ms p50.
            - **macOS (Apple Silicon) — CoreML**: nothing extra to install.
            - **Linux — CUDA**: NVIDIA GPUs. Requires the NVIDIA driver, the CUDA 12 runtime and cuDNN 9 on the machine; without them the app runs on CPU. The `.deb`, `.rpm` and Arch packages ship ONNX Runtime's CUDA provider; the `.AppImage` is CPU-only.

            The HUD's `ep` line shows which provider each model actually got.

            ### Also in v1.0.0
            - **Dynamic Threshold Configuration**: Adjust hold timers, angles, and score thresholds in real time without restarting.
            - **Settings Drawer**: In-app controls for Presence, Head Pose, Gaze Tracking, Prohibited Objects, Severities, and internal Developer Options.
            - **Interactive In-App Guide**: Built-in reference explaining all violation rules and severity tiers (Low, Medium, High, Critical).
            - **Persistent Storage**: Configuration auto-persists to `settings.toml` in OS app data with factory reset support.

            ### Setup
            1. Download and run the installer for your platform (MSI recommended on Windows; it bundles `DirectML.dll`).
            2. If Windows SmartScreen appears, click "More info" followed by "Run anyway".
            3. Position yourself facing the webcam and click "Enrol face" before starting the session.
