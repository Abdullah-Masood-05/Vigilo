[package]
name = "vigilo"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Exam proctoring desktop app: camera frames in, proctoring signals out, one project."
# Two binaries live here now — the app and `detect-cli` — so "the binary" is
# ambiguous and `cargo tauri build` refuses to guess which one to bundle.
default-run = "vigilo"

# Formerly two repositories: a headless `deepscreen-detect` library and this
# app, connected by a path dependency. Consolidated so a clone of this one
# folder is the whole product — see src/lib.rs for why, and what that traded
# away. `tauri` is now a crate-level dependency, but the constraint it used to
# enforce ("no tauri in the detection code") still holds: `tauri::` is used
# only in main.rs and its command handlers, never inside the lib modules.

[lib]
name = "vigilo"
path = "src/lib.rs"

[[bin]]
name = "vigilo"
path = "src/main.rs"

# `detect-cli` is a development harness, not part of the product, and it links
# its own copy of ONNX Runtime — shipping it puts the inference engine in the
# installer twice for ~32 MB of no benefit to a tester.
#
# Tauri's bundler sweeps every binary Cargo produces, and offers no way to
# exclude one, so the exclusion has to happen at the Cargo level:
# `required-features` means a default build does not produce it at all.
#
#     cargo run --features cli --bin detect-cli -- devices
#     cargo build --release --features cli --bin detect-cli
#
# `cargo test` still exercises the same library code, so nothing is untested by
# this — see `tests/`.
[[bin]]
name = "detect-cli"
path = "src/bin/detect-cli.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Preview transport: a loopback MJPEG stream, so the browser decodes frames
# and no pixels ever cross the Tauri IPC boundary (MODELS.md §12).
tiny_http = "0.12"

arc-swap = "1"
crossbeam-channel = "0.5"
image = "0.25"
fast_image_resize = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Inference. Pinned to one version so the app and detect-cli cannot disagree
# about the ONNX Runtime binary.
#
# No GPU execution provider is enabled here. Each one is a Cargo feature below
# (`gpu-directml`, `gpu-cuda`, `gpu-coreml`), picked per platform at build time
# — CI passes the right one for each OS. A plain `cargo build` is the CPU build.
#
# `copy-dylibs` is likewise not on by default. ONNX Runtime is statically
# linked, so on a CPU build there is nothing for it to copy; the GPU features
# that do have a real dynamic dependency turn it back on themselves.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "api-24",
] }
ndarray = "0.17"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Builds the `detect-cli` development harness. Off by default so it stays out
# of the installer — see the `[[bin]]` section above.
cli = []

# GPU execution providers, one per platform. Each is only ever registered on
# the OS it exists for (see `models::gpu_eps`), so a feature switched on for
# the wrong target is inert rather than fatal — registering DirectML on Linux
# was a SIGSEGV (9fc8956). A session that cannot get its GPU provider falls
# back to CPU with a warning, never an error.
#
#     cargo tauri build --features gpu-directml   # Windows
#     cargo tauri build --features gpu-coreml     # macOS
#     cargo tauri build --features gpu-cuda       # Linux (NVIDIA)
#
# DirectML: any DirectX 12 GPU. `DirectML.dll` (~17.7 MB) is a real dynamic
# dependency, so `copy-dylibs` puts it beside the exe for the bundler.
gpu-directml = ["ort/directml", "ort/copy-dylibs"]
# CUDA: NVIDIA only, and the machine needs the CUDA 12 runtime and cuDNN 9
# installed — ORT's CUDA provider is loaded at run time, so without them the
# session falls back to CPU. `copy-dylibs` brings
# `libonnxruntime_providers_{shared,cuda}.so` beside the binary, which is
# where ORT looks for them.
gpu-cuda = ["ort/cuda", "ort/copy-dylibs"]
# CoreML: Apple Silicon. Linked statically along with ORT, nothing to ship.
gpu-coreml = ["ort/coreml"]

# Shipping profile. `strip` and `lto` together are worth several MB in a binary
# this size and cost nothing at run time.
#
# `opt-level = "z"` is deliberately NOT set: this is a latency-bound pipeline
# with a 27 ms budget per frame, and trading throughput for the last couple of
# megabytes is the wrong side of that trade.
[profile.release]
strip = true
lto = true
