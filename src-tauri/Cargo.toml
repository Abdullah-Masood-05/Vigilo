[package]
name = "deepscreen-viewer"
version = "0.1.0"
edition = "2021"
description = "Exam proctoring desktop app: camera frames in, proctoring signals out, one project."
# Two binaries live here now — the app and `detect-cli` — so "the binary" is
# ambiguous and `cargo tauri build` refuses to guess which one to bundle.
default-run = "deepscreen-viewer"

# Formerly two repositories: a headless `deepscreen-detect` library and this
# app, connected by a path dependency. Consolidated so a clone of this one
# folder is the whole product — see src/lib.rs for why, and what that traded
# away. `tauri` is now a crate-level dependency, but the constraint it used to
# enforce ("no tauri in the detection code") still holds: `tauri::` is used
# only in main.rs and its command handlers, never inside the lib modules.

[lib]
name = "deepscreen_viewer"
path = "src/lib.rs"

[[bin]]
name = "detect-cli"
path = "src/bin/detect-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Preview transport: a loopback MJPEG stream, so the browser decodes frames
# and no pixels ever cross the Tauri IPC boundary (MODELS.md §12).
tiny_http = "0.12"

arc-swap = "1"
crossbeam-channel = "0.5"
image = "0.25"
fast_image_resize = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Inference. Pinned to one version so the app and detect-cli cannot disagree
# about the ONNX Runtime binary. DirectML is deliberately NOT enabled yet.
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"

[dev-dependencies]
tempfile = "3"

[features]
# Kept so `cargo tauri build` works unchanged; nothing custom here.
default = []
